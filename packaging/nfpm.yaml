# nfpm კონფიგი — deb/rpm პაკეტები PyInstaller-ის onedir გამოსავლიდან.
# გამოყენება: VERSION=1.0.0 nfpm package -f packaging/nfpm.yaml -p deb
# (VERSION გარემოს ცვლადი ავტომატურად ჩაისმება — nfpm აფართოებს ${...}-ს.)
name: gis-box
arch: amd64
platform: linux
version: ${VERSION}
section: science
priority: optional
maintainer: Giorgi Kapanadze <noreply@users.noreply.github.com>
description: |
  GIS_BOX — a small collection of GIS tools in one window:
  template copy, parcel search, coordinate extractor, batch rename and
  shapefile-to-Excel coordinate export.
vendor: GIS_BOX
homepage: https://github.com/GIS-GEORGIA/gis-toolkit
license: MIT

# System libraries the bundled Qt (PySide6) loads at start-up. Without them the V2 window cannot start on a
# minimal system (verified in a clean ubuntu:24.04 container: libEGL / libGL / libxkbcommon / xcb … missing).
# deb only - rpm package names differ (the rpm keeps its previous, dependency-free behaviour).
overrides:
  deb:
    depends:
      - libglib2.0-0t64 | libglib2.0-0
      - libegl1
      - libgl1
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libwayland-client0
      - libwayland-cursor0
      - fonts-dejavu-core          # Georgian glyphs

contents:
  # PyInstaller-ის onedir → /opt/gis-box/ (type: tree — სტრუქტურას ინახავს)
  - src: ./dist/GIS_BOX
    dst: /opt/gis-box
    type: tree
  # გამშვები სიმლინკი PATH-ში
  - src: /opt/gis-box/GIS_BOX
    dst: /usr/bin/gis-box
    type: symlink
  # მენიუს ჩანაწერი და ხატულა
  - src: ./packaging/gis-box.desktop
    dst: /usr/share/applications/gis-box.desktop
  - src: ./gis_box.png
    dst: /usr/share/icons/hicolor/256x256/apps/gis-box.png
