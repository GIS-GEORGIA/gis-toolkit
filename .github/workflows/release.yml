name: Release

# `v*` ტეგზე — აწყობს დამოუკიდებელ ბილდებს და ურთავს GitHub Release-ს.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows: standalone .exe (onedir → zip) ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: pyinstaller --clean --noconfirm gis_box.spec

      - name: Zip onedir
        run: Compress-Archive -Path dist/GIS_BOX/* -DestinationPath GIS_BOX-windows-x64.zip

      # SHA256 ფაილი თითო პაკეტზე (<პაკეტი>.sha256) — განახლების მენეჯერი მას ამოწმებს
      - name: SHA256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash GIS_BOX-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  GIS_BOX-windows-x64.zip" | Out-File -Encoding ascii GIS_BOX-windows-x64.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GIS_BOX-windows-x64.zip
            GIS_BOX-windows-x64.zip.sha256

  # ---------- Linux: tar.gz + deb + rpm + AppImage ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: pyinstaller --clean --noconfirm gis_box.spec

      - name: Tarball
        run: tar -C dist -czf GIS_BOX-linux-x64.tar.gz GIS_BOX

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go (for nfpm)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Package deb & rpm (nfpm)
        continue-on-error: true          # deb/rpm ვერ შეიქმნას → tarball მაინც აიტვირთოს
        env:
          VERSION: ${{ steps.ver.outputs.version || '0.0.0' }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          NFPM="$(go env GOPATH)/bin/nfpm"
          "$NFPM" package -f packaging/nfpm.yaml -p deb --target GIS_BOX-linux-x64.deb
          "$NFPM" package -f packaging/nfpm.yaml -p rpm --target GIS_BOX-linux-x64.rpm

      - name: Build AppImage (best-effort)
        continue-on-error: true
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/GIS_BOX/* AppDir/usr/bin/
          cp gis_box.png AppDir/gis-box.png
          cat > AppDir/gis-box.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GIS_BOX
          Exec=GIS_BOX
          Icon=gis-box
          Terminal=false
          Categories=Utility;Science;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/GIS_BOX" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -sSfL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run AppDir GIS_BOX-linux-x86_64.AppImage

      # SHA256 ფაილი თითო პაკეტზე (<პაკეტი>.sha256) — განახლების მენეჯერი მას ამოწმებს
      - name: SHA256 checksums
        run: |
          for f in GIS_BOX-linux-x64.tar.gz GIS_BOX-linux-x64.deb GIS_BOX-linux-x64.rpm GIS_BOX-linux-x86_64.AppImage; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256" || true
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GIS_BOX-linux-x64.tar.gz
            GIS_BOX-linux-x64.deb
            GIS_BOX-linux-x64.rpm
            GIS_BOX-linux-x86_64.AppImage
            GIS_BOX-linux-x64.tar.gz.sha256
            GIS_BOX-linux-x64.deb.sha256
            GIS_BOX-linux-x64.rpm.sha256
            GIS_BOX-linux-x86_64.AppImage.sha256
        # AppImage შესაძლოა არ შეიქმნას (best-effort) — action ცარიელ ფაილს გამოტოვებს
        continue-on-error: true
