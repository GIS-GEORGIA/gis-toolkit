name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Byte-compile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # ყველა წყაროს სინტაქსის შემოწმება — მძიმე დამოკიდებულებების ინსტალაციის
      # გარეშე (compileall მხოლოდ ბაიტ-კომპილაციას აკეთებს, არ აიმპორტებს).
      - name: Byte-compile all sources
        run: python -m compileall -q gis_box.py tools

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Linux-ზე GUI smoke-ტესტისთვის: tkinter-ის სისტემური ბიბლიოთეკები, ვირტუალური
      # ეკრანი (xvfb) და DejaVu შრიფტი (ქართული გლიფები).
      - name: Install Linux GUI dependencies (tk, xvfb, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb fonts-dejavu-core

      # მსუბუქი დამოკიდებულებები — სუფთა-ლოგიკის ტესტები + GUI smoke. მძიმე GIS
      # პაკეტები (geopandas…) არ სჭირდება: ხელსაწყოს, რომელსაც ისინი აკლია,
      # error-frame უჩნდება — smoke-ტესტი სწორედ ამას ამოწმებს.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest openpyxl

      # xvfb-run — რეალური Tk ფანჯარა ვირტუალურ ეკრანზე (Linux GUI ვალიდაცია)
      - name: Run tests (incl. GUI smoke under xvfb)
        run: xvfb-run -a python -m pytest -q
